<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pixel Office</title>
    <meta name="description" content="A living isometric pixel office with meeting, server and lunch rooms, seasons and an AI assistant." />
    <script>
      // No server on this host, so start the built-in simulation with every room open.
      (function () {
        var h = location.hostname, p = new URLSearchParams(location.search);
        if (h !== 'localhost' && h !== '127.0.0.1' && !p.has('sim')) {
          p.set('sim', '');
          if (!p.has('rooms')) p.set('rooms', 'all');
          history.replaceState(null, '', location.pathname + '?' + p.toString().replace('sim=', 'sim') + location.hash);
        }
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0d0d12; overflow: hidden; }
      .chat-column { display: none !important; }
      .room-tint, .room-alarm, .incident-beacon, .incident-beacon-sweep { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/ai.js"></script>
  </body>
</html>
