<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pixel-office</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #09111b;
        --panel: rgba(10, 18, 28, 0.75);
        --text: #edf6ff;
        --muted: #9ab5c8;
        --accent: #7fe0b5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #0c1620 0%, #1a2a36 100%);
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
      }
      .shell {
        width: min(1100px, calc(100vw - 32px));
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        box-shadow: 0 22px 70px rgba(0,0,0,0.35);
        overflow: hidden;
      }
      .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        background: #121b22;
      }
      .hud {
        display: flex;
        justify-content: space-between;
        padding: 14px 16px;
        border-top: 1px solid rgba(255,255,255,0.08);
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="stage" aria-label="Office scene" id="office-stage"></div>
      <div class="hud">
        <span>pixel-office demo</span>
        <span>public-ready</span>
      </div>
    </div>

    <script type="module" src="./fx.js"></script>
  </body>
</html>
